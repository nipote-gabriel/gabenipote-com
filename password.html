<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe Nipote</title>
    <link rel="icon" type="image/png" href="graphic assets/favicon.png">
    <link rel="apple-touch-icon" href="graphic assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0b0b;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .input-wrap {
            position: relative;
            width: 280px;
        }
        .input-wrap input {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0.5rem;
            color: #eee;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.75rem 2.75rem 0.75rem 1rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrap input:focus {
            border-color: #2B6B99;
        }
        .input-wrap input::placeholder {
            color: #555;
        }
        .eye-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0;
            width: auto;
            cursor: pointer;
            color: #555;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .eye-btn:hover {
            background: none;
            color: #aaa;
        }
        button {
            background: #2B6B99;
            border: none;
            border-radius: 0.5rem;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.75rem 2rem;
            width: 280px;
            transition: background 0.2s;
        }
        button:hover {
            background: #235a82;
        }
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <div class="form">
            <div class="input-wrap">
                <input type="password" id="pw" placeholder="Password" autofocus>
                <button class="eye-btn" type="button" onclick="togglePw()" tabindex="-1" aria-label="Toggle password visibility">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
            <button onclick="check()">Enter</button>
            <p class="error" id="err"></p>
        </div>
    </div>
    <script>
        document.getElementById('pw').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') check();
        });
        function togglePw() {
            var input = document.getElementById('pw');
            var icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
        function check() {
            var val = document.getElementById('pw').value;
            if (val.toLowerCase() === 'dangerfield') {
                sessionStorage.setItem('auth', '1');
                var dest = sessionStorage.getItem('authDest') || '/';
                sessionStorage.removeItem('authDest');
                window.location.href = dest;
            } else {
                document.getElementById('err').textContent = 'Incorrect password.';
                document.getElementById('pw').value = '';
                document.getElementById('pw').focus();
            }
        }
    </script>
</body>
</html>
