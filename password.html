<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe Nipote</title>
    <link rel="icon" type="image/png" href="graphic assets/favicon.png">
    <link rel="apple-touch-icon" href="graphic assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0b0b;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
        }
        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        input[type="password"] {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0.5rem;
            color: #eee;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            width: 280px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #2B6B99;
        }
        input[type="password"]::placeholder {
            color: #555;
        }
        button {
            background: #2B6B99;
            border: none;
            border-radius: 0.5rem;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.75rem 2rem;
            width: 280px;
            transition: background 0.2s;
        }
        button:hover {
            background: #235a82;
        }
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <div class="form">
            <input type="password" id="pw" placeholder="Password" autofocus>
            <button onclick="check()">Enter</button>
            <p class="error" id="err"></p>
        </div>
    </div>
    <script>
        document.getElementById('pw').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') check();
        });
        function check() {
            var val = document.getElementById('pw').value;
            if (val.toLowerCase() === 'headquarters') {
                sessionStorage.setItem('auth', '1');
                var dest = sessionStorage.getItem('authDest') || '/';
                sessionStorage.removeItem('authDest');
                window.location.href = dest;
            } else {
                document.getElementById('err').textContent = 'Incorrect password.';
                document.getElementById('pw').value = '';
                document.getElementById('pw').focus();
            }
        }
    </script>
</body>
</html>
